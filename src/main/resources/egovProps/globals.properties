# 값은 환경변수를 우선하고, 없으면 콜론 뒤 기본값(로컬 개발용)을 쓴다.
# 서버에서는 /etc/blog/app.env 로 주입한다. 비밀값을 이 파일에 직접 쓰지 않는다.

Globals.Blog.Postgre.Url=${BLOG_DB_URL:jdbc:postgresql://localhost:5432/blog}
Globals.Blog.Postgre.UserName=${BLOG_DB_USER:blog_app}
Globals.Blog.Postgre.Password=${BLOG_DB_PASSWORD:blog_app}

# 관리자 로그인 비밀번호. 비어 있으면 로그인할 수 없다
Globals.Blog.AdminPassword=${BLOG_ADMIN_PASSWORD:}

# 업로드한 대표 이미지 저장 폴더 (컨테이너 안 경로. docker-compose.yml 에서 호스트 폴더를 연결한다)
Globals.Blog.UploadDir=${BLOG_UPLOAD_DIR:/var/lib/blog/uploads}
