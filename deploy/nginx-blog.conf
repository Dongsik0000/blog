# /etc/nginx/snippets/blog.conf 로 복사한 뒤 devgear.kr 의 HTTPS server 블록에 포함한다.
# include /etc/nginx/snippets/blog.conf;
# 적용 전 sudo nginx -t 로 확인한다.

location = /blog {
    return 301 /blog/;
}

location /blog/ {
    # URI를 지정하지 않아 /blog/ 컨텍스트와 정적 자원 경로를 그대로 전달한다.
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 6m; # 대표 이미지 업로드 5MB + 여유 (web.xml multipart-config 와 맞춘다)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
